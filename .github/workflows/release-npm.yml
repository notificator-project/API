name: Publish Node.js package

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Verify release tag
        if: github.event_name == 'push'
        run: >-
          node -e "const version = require('./packages/api/package.json').version;
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== 'sdk-v' + version) {
            throw new Error('Release tag ' + tag + ' does not match SDK version sdk-v' + version);
          }"
      - name: Check npm registry
        id: registry
        run: |
          package_spec=$(node -p "const p = require('./packages/api/package.json'); p.name + '@' + p.version")
          if npm view "$package_spec" version --json > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package_spec is already available; skipping publication."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        run: npm publish --workspace @notificator-project/api --access public --provenance
